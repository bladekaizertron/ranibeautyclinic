<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boulevard API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        .result {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .error {
            background: #ffebee;
            color: #c62828;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        button {
            background: #0F1D2C;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1a2d3d;
        }
    </style>
</head>

<body>
    <h1>Boulevard API Connection Test</h1>
    <p>This page tests the connection to the Boulevard API through the PHP proxy.</p>

    <button onclick="testConnection()">Test Connection</button>

    <div id="result"></div>

    <script>
        async function testConnection() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="result">Testing connection...</div>';

            try {
                console.log('[Test] Sending request to /api/boulevard-proxy.php');

                const response = await fetch('/api/boulevard-proxy.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query: 'query { __typename }'
                    })
                });

                console.log('[Test] Response status:', response.status);
                console.log('[Test] Response headers:', response.headers);

                const text = await response.text();
                console.log('[Test] Response text:', text);

                if (!response.ok) {
                    resultDiv.innerHTML = `
                        <div class="result error">
                            <strong>❌ Connection Failed</strong><br><br>
                            <strong>HTTP Status:</strong> ${response.status}<br>
                            <strong>Response:</strong><br>${text}
                        </div>
                    `;
                    return;
                }

                const data = JSON.parse(text);

                resultDiv.innerHTML = `
                    <div class="result success">
                        <strong>✅ Connection Successful!</strong><br><br>
                        <strong>Response:</strong><br>${JSON.stringify(data, null, 2)}
                    </div>
                `;

            } catch (error) {
                console.error('[Test] Error:', error);
                resultDiv.innerHTML = `
                    <div class="result error">
                        <strong>❌ Error</strong><br><br>
                        <strong>Message:</strong> ${error.message}<br>
                        <strong>Stack:</strong><br>${error.stack}
                    </div>
                `;
            }
        }
    </script>
</body>

</html>
