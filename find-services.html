<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Find Services</title>
    <style>
        body {
            font-family: -apple-system, system-ui, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .error {
            color: red;
            background: #fee;
            padding: 10px;
            border-radius: 4px;
        }

        .success {
            color: green;
            background: #efe;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .card {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .id {
            font-family: monospace;
            background: #eee;
            padding: 2px 5px;
            border-radius: 3px;
            user-select: all;
            cursor: pointer;
        }

        h4 {
            margin: 0 0 5px 0;
        }

        small {
            color: #666;
        }

        button {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Service Finder (via Cart)</h1>
    <div id="status">initializing...</div>
    <div id="output"></div>

    <script>
        const PROXY_URL = '/api/boulevard-proxy.php';
        // Ponytail Laser
        const ITEM_ID = 'urn:blvd:Service:02c334c0-2737-450b-8f6d-22dc07fff07f';

        async function gql(query, variables = {}) {
            const res = await fetch(PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, variables })
            });
            const json = await res.json();
            if (json.errors) throw new Error(JSON.stringify(json.errors, null, 2));
            return json.data;
        }

        async function init() {
            const status = document.getElementById('status');
            const output = document.getElementById('output');

            try {
                // 1. Find Location
                status.innerText = 'Step 1: Finding location...';
                const locData = await gql(`query { locations(first: 1) { edges { node { id name tz } } } }`);
                const location = locData.locations?.edges?.[0]?.node;
                const tz = location.tz || 'America/Los_Angeles';

                status.innerHTML = `<div class="success">Connected to: <strong>${location.name}</strong> (${tz})</div>`;

                // 2. Create Cart
                status.innerHTML += 'Step 2: Creating cart...';
                const cartData = await gql(`mutation ($loc: ID!) { createCart(input: { locationId: $loc }) { cart { id } } }`, { loc: location.id });
                const cartId = cartData.createCart?.cart?.id;

                // 3. Add Item
                status.innerHTML += ' Adding Item...';
                await gql(`
                    mutation ($cartId: ID!, $itemId: ID!) {
                        addCartSelectedBookableItem(input: { id: $cartId, itemId: $itemId }) {
                            cart { id }
                        }
                    }
                `, { cartId: cartId, itemId: ITEM_ID });
                status.innerHTML += ' <strong style="color:green">Added!</strong><br>';

                // 4. Debug Bookable Times Schema
                status.innerHTML += '<br><strong>Checking Availability for next 7 days...</strong><br>';

                // Get next 7 dates
                const dates = [];
                for (let i = 0; i < 7; i++) {
                    const d = new Date();
                    d.setDate(d.getDate() + i);
                    dates.push(d.toISOString().split('T')[0]);
                }

                output.innerHTML = '';

                // Try "Attempt A" Schema on all dates
                output.innerHTML += '<h3>Checking Dates (Schema A: Direct List)</h3>';
                for (const d of dates) {
                    try {
                        const res = await gql(`
                            query ($id:ID!, $d:Date!, $tz:String!) {
                                cartBookableTimes(id:$id, searchDate:$d, tz:$tz) {
                                    id startTime
                                }
                            }
                        `, { id: cartId, d: d, tz: tz });

                        const times = res.cartBookableTimes || [];
                        const timeStr = times.length > 0 ? times.map(t => t.startTime.split('T')[1].substring(0, 5)).join(', ') : 'None';

                        output.innerHTML += `<div style="${times.length > 0 ? 'background:#efe;font-weight:bold' : ''}">${d}: ${times.length} slots (${timeStr})</div>`;
                    } catch (e) {
                        output.innerHTML += `<div class="error">${d}: Error - ${e.message}</div>`;
                    }
                }

            } catch (e) {
                status.innerHTML += `<div class="error">Critical Error: ${e.message}</div>`;
            }
        }

        init();
    </script>
</body>

</html>
